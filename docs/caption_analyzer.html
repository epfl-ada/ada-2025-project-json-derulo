<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caption Analyzer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        body {
            font-family: "Adobe Caslon Pro", "Caslon", "Georgia", "Times New Roman", serif;
            background-color: #fff;
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start; /* ← key */
            box-sizing: border-box;
        }

        h3 {
            font-family: "Playfair Display", "Irvin", "Georgia", serif;
            font-weight: normal;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            font-size: 1.5rem;
        }

        .container {
            width: 100%;
            max-width: 600px;
            text-align: center;
            border: 2px solid #000;
            padding: 24px;
            background-color: #f9f9f9;
            box-shadow: 5px 5px 0px rgba(0,0,0,0.1);
        }

        p {
            font-style: italic;
            margin-bottom: 20px;
        }

        input[type="text"] {
            width: 80%;
            padding: 15px;
            font-size: 1.1rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-family: inherit;
            margin-bottom: 15px;
            outline: none;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            border-color: #000;
        }

        button {
            background-color: #000;
            color: #fff;
            border: none;
            padding: 12px 25px;
            font-size: 1rem;
            font-family: "Futura", "Helvetica Neue", sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.1s;
        }

        button:hover {
            background-color: #333;
        }

        button:active {
            transform: scale(0.98);
        }

        #result-area {
            margin-top: 20px;
            min-height: 50px;
        }

        .verdict {
            font-weight: bold;
            font-size: 1.2rem;
            display: block;
            margin-bottom: 5px;
        }

        .details {
            font-size: 0.95rem;
            color: #555;
        }

        .badge {
            display: inline-block;
            padding: 4px 8px;
            margin: 0 2px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
            color: white;
        }
        .badge-good { background-color: #28a745; }
        .badge-bad { background-color: #dc3545; }
        .badge-warn { background-color: #ffc107; color: black; }

    </style>
</head>
<body>

    <div class="container">
        <h3>The Caption Analyzer</h3>
        <p>Enter your caption.
            We’ll tell you if it’s New Yorker–worthy or Dad-Joke Embassy material.</p>
        
        <img id="contest-image" alt="New Yorker Cartoon" style="max-width: 80%; max-height: 250px; margin-bottom: 20px; border: 1px solid #ccc; padding: 5px;">

        <br>
        <input type="text" id="userCaption" placeholder="Type your witty caption here..." onkeypress="handleEnter(event)">
        <br>
        <button onclick="analyzeCaption()">Analyze</button>

        <div id="result-area">
            <span id="result-verdict" class="verdict"></span>
            <span id="result-details" class="details"></span>
        </div>
    </div>

    <script>
        // Load a random image on startup
        const images = ["510.jpg", "511.jpg", "512.jpg"];
        const randomImage = images[Math.floor(Math.random() * images.length)];
        document.getElementById("contest-image").src = "images/quiz/" + randomImage;
    
        function handleEnter(e) {
            if (e.key === 'Enter') {
                analyzeCaption();
            }
        }
        const deadpanNotes = [
            "Likely funny. Or not.",
            "Strong structure detected. Probably.",
            "This caption has words. Good start.",
            "Confidence interval: vibes."
        ];

        function analyzeCaption() {
            const text = document.getElementById('userCaption').value;
            const words = text.trim().split(/\s+/).filter(w => w.length > 0);
            const wordCount = words.length;
    
            const verdictDisplay = document.getElementById('result-verdict');
            const detailsDisplay = document.getElementById('result-details');
    
            if (wordCount === 0) {
                verdictDisplay.textContent = "Verdict: Bold Silence.";
                verdictDisplay.style.color = "#555";
                detailsDisplay.innerHTML =
                    "Minimalism is a choice. This one is difficult to evaluate.";
                return;
            }
    
            /* -------------------------------------------------
               Fake analysis (because we proved it doesn’t work)
            -------------------------------------------------- */
    
            const lengthBadges = [
                `<span class="badge badge-good">Excellent Length</span>`,
                `<span class="badge badge-warn">Questionable Length</span>`,
                `<span class="badge badge-bad">Concerning Length</span>`
            ];

                const vocabBadges = [
                `<span class="badge badge-good">Approachable Vocabulary</span>`,
                `<span class="badge badge-warn">Ambitious Vocabulary</span>`,
                `<span class="badge badge-bad">Suspicious Vocabulary</span>`
            ];
    
            const verdicts = [
                { text: "Verdict: This Might Be Funny.", color: "#28a745" },
                { text: "Verdict: Hard to Say.", color: "#d39e00" },
                { text: "Verdict: This Is Not Working.", color: "#dc3545" }
            ];
    
            // 🎲 Random selection (on purpose)
            const lengthMsg = lengthBadges[Math.floor(Math.random() * lengthBadges.length)];
            const vocabMsg = vocabBadges[Math.floor(Math.random() * vocabBadges.length)];
            const verdict = verdicts[Math.floor(Math.random() * verdicts.length)];
    
            verdictDisplay.textContent = verdict.text;
            verdictDisplay.style.color = verdict.color;
            const note = deadpanNotes[Math.floor(Math.random() * deadpanNotes.length)];

            detailsDisplay.innerHTML = `
            ${lengthMsg}<br>
            ${vocabMsg}<br><br>
            <strong>${note}</strong><br>
            <em>
            (Basically, we just made this for fun)
            
            </em>
        `;
        }
    </script>
</body>
</html>
